<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>国语功能大挑战</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","Noto Sans CJK SC",Arial,sans-serif;background:#f4efff;color:#292238}
.wrap{max-width:1100px;margin:auto;padding:18px}
h1{text-align:center;margin:5px 0;font-size:34px}
.sub{text-align:center;color:#6d6479;margin-bottom:15px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff;border-radius:18px;padding:13px 16px}
.badge{background:#eee7ff;border-radius:999px;padding:8px 13px;font-weight:800}
.question{margin-top:14px;background:#fff;border-radius:22px;min-height:120px;padding:22px;text-align:center;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center}
.game{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:14px;margin-top:14px}
.zone{min-height:290px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.left{background:#e9f8ed;border:5px dashed #58a969}.right{background:#ffe9e9;border:5px dashed #d46363}
.zone .icon{font-size:55px}.zone .word{font-size:42px}.zone small{font-size:15px;color:#6d6479}
.camera{background:#17131c;border-radius:24px;min-height:290px;overflow:hidden;position:relative}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);color:#fff;border-radius:18px;padding:8px 11px;font-size:13px}
.status{text-align:center;font-weight:800;font-size:17px;min-height:28px;margin:13px}
.result{text-align:center;font-size:28px;font-weight:900;min-height:40px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:13px;padding:12px 18px;font-weight:900;font-size:15px;cursor:pointer}
.primary{background:#6949d8;color:#fff}.secondary{background:#e6dfff}.danger{background:#ffe0e0}
button:disabled{opacity:.45;cursor:not-allowed}
.help{text-align:center;color:#70677d;font-size:13px;line-height:1.6;margin-top:12px}
@media(max-width:800px){.game{grid-template-columns:1fr}.camera{order:-1}.question{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎮 国语功能大挑战</h1>
<div class="sub">站到「对」或「错」区域，摄像头自动判断答案</div>

<div class="top">
<div class="badge" id="qn">第 1 / 15 题</div>
<div class="badge">⭐ 得分：<span id="score">0</span></div>
<div class="badge">⏱️ <span id="time">10</span> 秒</div>
</div>

<div class="question" id="question"></div>

<div class="game">
<div class="zone left"><div class="icon">🟢</div><div class="word">对</div><small>站在左边</small></div>

<div class="camera">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div class="cam" id="cam">📷 摄像头尚未启动</div>
</div>

<div class="zone right"><div class="icon">🔴</div><div class="word">错</div><small>站在右边</small></div>
</div>

<div class="status" id="status">先点击「启动摄像头」测试。</div>
<div class="result" id="result"></div>

<div class="controls">
<button class="primary" id="cameraBtn">📷 启动摄像头</button>
<button class="primary" id="gameBtn" disabled>▶ 开始游戏</button>
<button class="secondary" id="nextBtn" disabled>➡ 下一题</button>
<button class="danger" id="restartBtn">🔄 重新开始</button>
</div>

<div class="help">
第一次使用：Chrome 会要求摄像头权限，请选择「允许」。<br>
如果镜头画面出现学生，但人体检测显示失败，请刷新网页再试一次。
</div>
</div>

<script>
const questions=[
["国语是马来西亚的身份象征。",true,"身份象征"],
["国语只可以用于文学创作。",false,"文学语言"],
["国语可以作为不同种族之间沟通的语言。",true,"通用语／沟通语言"],
["国语是法律事务的官方语言。",true,"法律语言"],
["国语不能用于商业和经济事务。",false,"商业语言"],
["政府进行官方会议时可以使用国语。",true,"行政语言"],
["国语是我国教育体系中的主要教学语言。",true,"教育语言"],
["国语只能由马来族使用。",false,"通用语"],
["国语可以作为我国多元文化社会的沟通工具。",true,"沟通语言"],
["法院处理法律事务时，国语可以作为官方语言。",true,"法律语言"],
["国语完全没有商业功能。",false,"商业语言"],
["官方会议、说明会和政府事务可以使用国语。",true,"行政语言"],
["学校教学与国语没有关系。",false,"教育语言"],
["国语也是我国在世界舞台上的象征。",true,"身份象征"],
["国语的功能只有一种，就是日常聊天。",false,"国语具有多种功能"]
];

const $=id=>document.getElementById(id);
const video=$("video"),canvas=$("canvas"),ctx=canvas.getContext("2d");
let stream=null,pose=null,idx=0,score=0,answered=false,time=10,timer=null,raf=null,lastZone=null,stable=0,detecting=false;

function render(){
 const q=questions[idx];
 $("qn").textContent=`第 ${idx+1} / ${questions.length} 题`;
 $("question").textContent=q[0];
 $("score").textContent=score;
 $("time").textContent=10;
 $("result").textContent="";
 $("status").textContent="站到「对」或「错」区域。";
 $("nextBtn").disabled=true;
 answered=false;lastZone=null;stable=0;
}
function startTimer(){
 clearInterval(timer);time=10;$("time").textContent=time;
 timer=setInterval(()=>{
  if(answered)return;
  time--;$("time").textContent=time;
  if(time<=0){clearInterval(timer);answered=true;$("result").textContent="⏰ 时间到！";$("status").textContent=`正确答案：${questions[idx][1]?"对":"错"}`;$("nextBtn").disabled=false;}
 },1000);
}
function answer(zone){
 if(answered)return;
 answered=true;clearInterval(timer);
 const chosen=zone==="left",correct=questions[idx][1];
 if(chosen===correct){
  score++;$("score").textContent=score;
  $("result").textContent="🎉 回答正确！ +1 分";
  $("status").textContent=`国语功能：${questions[idx][2]}`;
 }else{
  $("result").textContent="❌ 回答错误";
  $("status").textContent=`正确答案：${correct?"对":"错"} ｜ 国语功能：${questions[idx][2]}`;
 }
 $("nextBtn").disabled=false;
}
async function startCamera(){
 if(!window.isSecureContext){throw new Error("网页不是安全连接，请使用 GitHub Pages 的 https:// 网址。");}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){throw new Error("浏览器不支持摄像头，请使用最新版 Chrome。");}
 stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:"user"},audio:false});
 video.srcObject=stream;
 await video.play();
 canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;
 $("cam").textContent="🟢 摄像头正常";
 $("status").textContent="摄像头正常！现在可以点击「开始游戏」。";
 $("gameBtn").disabled=false;
}
async function loadPose(){
 $("cam").textContent="⏳ 正在加载人体检测…";
 try{
  const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm");
  const files=await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm");
  pose=await vision.PoseLandmarker.createFromOptions(files,{
   baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},
   runningMode:"VIDEO",numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5
  });
  $("cam").textContent="🟢 人体检测已准备";
  return true;
 }catch(e){
  console.error(e);
  $("cam").textContent="🟡 摄像头正常，人体检测加载失败";
  $("status").textContent="摄像头正常，但人体检测模型暂时无法加载。请刷新网页后再试。";
  return false;
 }
}
function detect(now){
 if(!detecting||!pose){return;}
 if(video.readyState<2){raf=requestAnimationFrame(detect);return;}
 try{
  const r=pose.detectForVideo(video,now);
  if(!r.landmarks||!r.landmarks.length){
   $("cam").textContent="🟢 摄像头正常｜请站到镜头前";
   lastZone=null;stable=0;
  }else{
   const p=r.landmarks[0];
   const ids=[11,12,23,24].filter(i=>p[i]&&p[i].visibility>.35);
   if(ids.length>=2){
    const x=ids.reduce((s,i)=>s+p[i].x,0)/ids.length;
    const zone=x<.5?"left":"right";
    $("cam").textContent=zone==="left"?"🟢 检测：对区域":"🔴 检测：错区域";
    if(zone!==lastZone){lastZone=zone;stable=now;}
    if(!answered&&now-stable>900)answer(zone);
   }
  }
 }catch(e){console.error(e);}
 raf=requestAnimationFrame(detect);
}
$("cameraBtn").onclick=async()=>{
 $("cameraBtn").disabled=true;
 try{await startCamera();await loadPose();}
 catch(e){
  $("cam").textContent="🔴 摄像头启动失败";
  $("status").textContent="❌ "+e.message+" 请检查 Chrome 的摄像头权限。";
  $("cameraBtn").disabled=false;
 }
};
$("gameBtn").onclick=async()=>{
 if(!pose){
  const ok=await loadPose();if(!ok)return;
 }
 render();startTimer();detecting=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(detect);
 $("gameBtn").disabled=true;
};
$("nextBtn").onclick=()=>{
 if(idx<questions.length-1){idx++;render();startTimer();}
 else{$("result").textContent=`🎊 完成！最终得分：${score} / ${questions.length}`;$("status").textContent="挑战完成！";$("nextBtn").disabled=true;}
};
$("restartBtn").onclick=()=>{
 idx=0;score=0;render();
 if(pose&&stream){$("gameBtn").disabled=false;}
};
render();
</script>
</body>
</html>
